name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  MAPEL_TEST_DATA_POLICY: synthetic_only
  MAPEL_TEST_SEED: "20260816"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci-py312.txt -e ".[core,dev]"
      - name: Verify generated capability matrix
        run: |
          python scripts/generate_capability_matrix.py
          git diff --exit-code -- docs/CAPABILITY_MATRIX.md
      - name: Verify generated error-code catalogue
        run: python scripts/generate_error_code_catalogue.py --check
      - name: Verify fail-closed release controls
        run: python scripts/verify_release_readiness.py --expect-blocked
      - name: Verify repository
        run: python scripts/verify_repository.py
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Type checking
        run: mypy src tests
      - name: Pre-commit
        run: pre-commit run --all-files
      - name: Prepare third-party dependency audit
        run: |
          # The unpublished editable project cannot be resolved by the PyPI
          # advisory service in strict mode. Remove only its distribution
          # metadata while retaining every installed third-party dependency.
          python -m pip uninstall --yes mapel-linkage-engine
      - name: Dependency audit
        run: pip-audit --local --strict --progress-spinner off
      - name: Generate privacy-safe SBOM
        run: |
          pip-audit --local --strict --progress-spinner off \
            --format cyclonedx-json \
            --output "${RUNNER_TEMP}/mapel-linkage-sbom.cdx.json"
          test -s "${RUNNER_TEMP}/mapel-linkage-sbom.cdx.json"
      - name: Restore editable project
        if: always()
        run: python -m pip install --no-deps --editable .
      - name: Tests
        run: pytest
      - name: Build
        run: python -m build
      - name: Inspect distribution
        run: python scripts/verify_repository.py --distribution dist

  all-models:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core, LightGBM, and CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.13.0"
          python -m pip install \
            -c constraints/ci-py312.txt \
            -e ".[core,dev,lightgbm]"
      - name: Confirm optional model runtimes
        run: |
          python -c "import lightgbm, torch; print(lightgbm.__version__, torch.__version__)"
      - name: Run complete suite with no skips
        run: |
          pytest --junitxml="${RUNNER_TEMP}/all-models.xml"
          REPORT_PATH="${RUNNER_TEMP}/all-models.xml" python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path(os.environ["REPORT_PATH"])
          root = ElementTree.parse(report).getroot()
          if root.tag == "testsuite":
              skipped = int(root.attrib.get("skipped", "0"))
          else:
              skipped = sum(
                  int(suite.attrib.get("skipped", "0"))
                  for suite in root.findall("testsuite")
              )
          if skipped:
              raise SystemExit(f"all-models CI skipped {skipped} tests")
          PY
