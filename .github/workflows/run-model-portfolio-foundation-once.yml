name: run-model-portfolio-foundation-once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"
  MAPEL_TEST_DATA_POLICY: synthetic_only
  MAPEL_TEST_SEED: "20260816"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  build:
    if: github.head_ref == 'agent/model-portfolio-recipe-orchestration'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Extract and execute the approved bounded generator
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/build-model-portfolio-foundation-once.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          start_marker = '      - name: Write bounded portfolio and recipe foundation'
          end_marker = '      - name: Install full development and optional-model environment'
          try:
              start = lines.index(start_marker)
              run_line = lines.index('        run: |', start)
              end = lines.index(end_marker, run_line)
          except ValueError as error:
              raise SystemExit('approved generator block could not be located') from error
          body = []
          for line in lines[run_line + 1 : end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/write-model-portfolio-foundation.sh').write_text(
              'set -euo pipefail\n' + '\n'.join(body) + '\n',
              encoding='utf-8',
          )
          PY
          rm .github/workflows/run-model-portfolio-foundation-once.yml
          bash /tmp/write-model-portfolio-foundation.sh
      - name: Install full development and optional-model environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci-py312.txt -e ".[core,dev,lightgbm,neural]"
      - name: Format, regenerate derived contracts, and verify
        run: |
          ruff format .
          python scripts/generate_config_schema.py
          python scripts/generate_capability_matrix.py
          python scripts/generate_repository_manifest.py
          python scripts/verify_repository.py
          ruff format --check .
          ruff check .
          mypy src tests
          pytest -q
          rm -rf build dist
          python -m build
          python scripts/verify_repository.py --distribution dist
      - name: Commit verified foundation and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add model portfolio and recipe foundation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
