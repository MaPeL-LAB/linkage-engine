name: fix-m1-test-packages

on:
  push:
    branches: [agent/m1-safe-foundation-implementation]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Make nested test directories packages
        run: |
          touch tests/configuration/__init__.py
          touch tests/governance/__init__.py
          touch tests/synthetic/__init__.py
          rm .github/workflows/fix-m1-test-packages.yml
          python scripts/generate_repository_manifest.py
          ruff format --check .
          ruff check .
          mypy src tests
          pytest
          python scripts/verify_repository.py
      - name: Commit test package fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make M1 nested test directories packages"
          git push
