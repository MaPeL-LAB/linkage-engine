name: finalize-m2a-candidate-foundation

on:
  push:
    branches: [agent/m2a-duckdb-candidate-foundation]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Format and verify M2A source and package
        run: |
          rm .github/workflows/finalize-m2a-candidate-foundation.yml
          ruff format .
          ruff check --fix .
          ruff format .
          python scripts/generate_repository_manifest.py
          python scripts/verify_repository.py
          ruff format --check .
          ruff check .
          mypy src tests
          pre-commit run --all-files
          pytest
          python -m build
          python scripts/verify_repository.py --distribution dist
      - name: Commit verified M2A source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add M2A local DuckDB candidate foundation"
          git push
