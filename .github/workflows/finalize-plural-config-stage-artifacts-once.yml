name: finalize-plural-config-stage-artifacts-once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"
  MAPEL_TEST_DATA_POLICY: synthetic_only
  MAPEL_TEST_SEED: "20260816"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  finalize:
    if: github.head_ref == 'agent/plural-model-configuration-stage-artifacts'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request head branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Materialize typed source changes and remove one-use machinery
        run: |
          python - <<'PY'
          from pathlib import Path

          patch_path = Path("scripts/apply_plural_model_stage_patch.py")
          patch_text = patch_path.read_text(encoding="utf-8")
          old_marker = '    new_models + "\\n\\nclass CalibrationConfig(ConfigNode):\\n",\n'
          new_marker = '    new_models + "\\n\\n",\n'
          if patch_text.count(old_marker) != 1:
              raise SystemExit("plural-model patch repair marker was not found exactly once")
          patch_path.write_text(patch_text.replace(old_marker, new_marker, 1), encoding="utf-8")
          PY
          python scripts/apply_plural_model_stage_patch.py
          python - <<'PY'
          from pathlib import Path

          models_path = Path("src/mapel_linkage/configuration/models.py")
          models_text = models_path.read_text(encoding="utf-8")
          method_start = models_text.index("    def _validate_models(self) -> None:\n")
          supervised_start = models_text.index("        supervised = [\n", method_start)
          supervised_end_marker = (
              '            raise ValueError("Enabled supervised models require eligible verified labels.")\n'
          )
          supervised_end = models_text.index(supervised_end_marker, supervised_start) + len(
              supervised_end_marker
          )
          typed_supervised = (
              "        supervised_requires_verified_labels = (\n"
              "            any(\n"
              "                model.enabled and model.require_verified_labels\n"
              "                for model in self.models.all_boosted_trees()\n"
              "            )\n"
              "            or any(\n"
              "                model.enabled and model.require_verified_labels\n"
              "                for model in self.models.all_ranking_models()\n"
              "            )\n"
              "            or any(\n"
              "                model.enabled and model.require_verified_labels\n"
              "                for model in self.models.all_neural_models()\n"
              "            )\n"
              "            or any(\n"
              "                model.enabled and model.require_verified_labels\n"
              "                for model in self.models.ensembles\n"
              "            )\n"
              "        )\n"
              "        if supervised_requires_verified_labels and not eligible_truth:\n"
              '            raise ValueError("Enabled supervised models require eligible verified labels.")\n'
          )
          models_text = (
              models_text[:supervised_start]
              + typed_supervised
              + models_text[supervised_end:]
          )
          models_path.write_text(models_text, encoding="utf-8")

          portfolio_path = Path("src/mapel_linkage/pipeline/model_portfolio.py")
          portfolio_text = portfolio_path.read_text(encoding="utf-8")
          ranker_start = portfolio_text.index(
              "    ranker_by_id: dict[str, RankingCandidateDeclaration] = {}\n"
          )
          ranker_end = portfolio_text.index(
              "\n    requested = config.models.portfolio\n", ranker_start
          )
          typed_ranker = (
              "    ranker_by_id: dict[str, RankingCandidateDeclaration] = {}\n"
              "    for ranking in config.models.all_ranking_models():\n"
              '        ranker_family: Literal["xgboost", "lightgbm"] = (\n'
              '            "xgboost" if ranking.implementation == "xgboost_ranker" else "lightgbm"\n'
              "        )\n"
              '        ranker_artifact_format: Literal["xgboost_json", "lightgbm_text"] = (\n'
              '            "xgboost_json" if ranker_family == "xgboost" else "lightgbm_text"\n'
              "        )\n"
              "        ranker_by_id[ranking.model_id] = RankingCandidateDeclaration(\n"
              "            model_id=ranking.model_id,\n"
              "            family=ranker_family,\n"
              "            implementation=ranking.implementation,\n"
              "            enabled=ranking.enabled,\n"
              "            query_side=ranking.query_side,\n"
              "            top_k=ranking.top_k,\n"
              "            artifact_format=ranker_artifact_format,\n"
              "        )\n"
          )
          portfolio_text = portfolio_text[:ranker_start] + typed_ranker + portfolio_text[ranker_end:]
          removed_assignments = {
              "allow_shadow_scoring = True",
              "allow_shadow_scoring = requested.allow_shadow_scoring",
          }
          portfolio_lines = [
              line
              for line in portfolio_text.splitlines()
              if line.strip() not in removed_assignments
          ]
          portfolio_text = "\n".join(portfolio_lines) + "\n"
          literal_argument = "        allow_shadow_scoring=allow_shadow_scoring,\n"
          if portfolio_text.count(literal_argument) != 1:
              raise SystemExit("literal shadow-scoring argument marker was not found exactly once")
          portfolio_text = portfolio_text.replace(
              literal_argument,
              "        allow_shadow_scoring=True,\n",
              1,
          )
          portfolio_path.write_text(portfolio_text, encoding="utf-8")
          PY
          rm scripts/apply_plural_model_stage_patch.py
          rm .github/workflows/verify-plural-config-stage-artifacts-once.yml
          rm .github/workflows/finalize-plural-config-stage-artifacts-once.yml
      - name: Install core, LightGBM, CPU PyTorch, and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.13.0"
          python -m pip install \
            -c constraints/ci-py312.txt \
            -e ".[core,dev,lightgbm]"
      - name: Format, apply safe lint fixes, and regenerate derived contracts
        run: |
          ruff format .
          ruff check --fix .
          python scripts/generate_config_schema.py
          python scripts/generate_capability_matrix.py
          python scripts/generate_repository_manifest.py
      - name: Run complete Python 3.12 all-model gate
        run: |
          python scripts/verify_repository.py
          ruff format --check .
          ruff check .
          mypy src tests
          pre-commit run --all-files
          pytest --junitxml="${RUNNER_TEMP}/all-models.xml"
          REPORT_PATH="${RUNNER_TEMP}/all-models.xml" python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path(os.environ["REPORT_PATH"])
          root = ElementTree.parse(report).getroot()
          if root.tag == "testsuite":
              skipped = int(root.attrib.get("skipped", "0"))
          else:
              skipped = sum(
                  int(suite.attrib.get("skipped", "0"))
                  for suite in root.findall("testsuite")
              )
          if skipped:
              raise SystemExit(f"all-model verification skipped {skipped} tests")
          PY
          rm -rf build dist
          python -m build
          python scripts/verify_repository.py --distribution dist
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add plural model configuration and immutable stage artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
