name: finalize-i2a-stage1-advisor-once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"
  MAPEL_TEST_DATA_POLICY: synthetic_only
  MAPEL_TEST_SEED: "20260816"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  finalize:
    if: github.head_ref == 'agent/i2a-stage1-linkage-strategy-advisor'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request head branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Materialize checksum-controlled I2A batch and remove transfer machinery
        run: |
          python scripts/materialize_i2a_batch.py
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one lint-repair marker in {path}.")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/mapel_linkage/recommendation/advisor.py",
              (
                  "    if context.intent is RecommendationIntent.INFER_WITH_APPROVED_RECIPE:\n"
                  "        if not context.approved_recipe_available:\n"
                  "            abstention_reasons.append(AbstentionReason.APPROVED_RECIPE_REQUIRED)\n"
                  "    if context.intent is RecommendationIntent.SHADOW_SCORE_CHALLENGER:\n"
                  "        if not context.approved_artifact_model_ids:\n"
                  "            abstention_reasons.append(AbstentionReason.APPROVED_ARTIFACT_REQUIRED)\n"
              ),
              (
                  "    if (\n"
                  "        context.intent is RecommendationIntent.INFER_WITH_APPROVED_RECIPE\n"
                  "        and not context.approved_recipe_available\n"
                  "    ):\n"
                  "        abstention_reasons.append(AbstentionReason.APPROVED_RECIPE_REQUIRED)\n"
                  "    if (\n"
                  "        context.intent is RecommendationIntent.SHADOW_SCORE_CHALLENGER\n"
                  "        and not context.approved_artifact_model_ids\n"
                  "    ):\n"
                  "        abstention_reasons.append(AbstentionReason.APPROVED_ARTIFACT_REQUIRED)\n"
              ),
          )
          replace_once(
              "src/mapel_linkage/recommendation/contracts.py",
              (
                  "        if self.mandatory_baseline_candidate_id is not None and self.shortlist:\n"
                  "            if self.mandatory_baseline_candidate_id not in shortlist_ids:\n"
                  "                raise ValueError(\"A non-empty shortlist must retain the mandatory baseline.\")\n"
              ),
              (
                  "        if (\n"
                  "            self.mandatory_baseline_candidate_id is not None\n"
                  "            and self.shortlist\n"
                  "            and self.mandatory_baseline_candidate_id not in shortlist_ids\n"
                  "        ):\n"
                  "            raise ValueError(\"A non-empty shortlist must retain the mandatory baseline.\")\n"
              ),
          )
          replace_once(
              "src/mapel_linkage/recommendation/contracts.py",
              (
                  "        if self.coverage_status is CoverageStatus.STRUCTURAL_ONLY:\n"
                  "            if AbstentionReason.NO_BENCHMARK_EVIDENCE not in self.abstention_reasons:\n"
                  "                raise ValueError(\"Structural-only advice must disclose missing benchmark evidence.\")\n"
              ),
              (
                  "        if (\n"
                  "            self.coverage_status is CoverageStatus.STRUCTURAL_ONLY\n"
                  "            and AbstentionReason.NO_BENCHMARK_EVIDENCE not in self.abstention_reasons\n"
                  "        ):\n"
                  "            raise ValueError(\n"
                  "                \"Structural-only advice must disclose missing benchmark evidence.\"\n"
                  "            )\n"
              ),
          )
          replace_once(
              "src/mapel_linkage/recommendation/eligibility.py",
              (
                  "    if context.intent is RecommendationIntent.INFER_WITH_APPROVED_RECIPE:\n"
                  "        if not context.approved_recipe_available:\n"
                  "            reasons.append(EligibilityReason.APPROVED_RECIPE_REQUIRED)\n"
                  "        if candidate.pair_model_id not in context.approved_artifact_model_ids:\n"
                  "            reasons.append(EligibilityReason.APPROVED_ARTIFACT_REQUIRED)\n"
                  "    elif context.intent is RecommendationIntent.SHADOW_SCORE_CHALLENGER:\n"
                  "        if not context.approved_recipe_available:\n"
                  "            reasons.append(EligibilityReason.APPROVED_RECIPE_REQUIRED)\n"
                  "        if candidate.pair_model_id not in context.approved_artifact_model_ids:\n"
                  "            reasons.append(EligibilityReason.APPROVED_ARTIFACT_REQUIRED)\n"
              ),
              (
                  "    if context.intent in {\n"
                  "        RecommendationIntent.INFER_WITH_APPROVED_RECIPE,\n"
                  "        RecommendationIntent.SHADOW_SCORE_CHALLENGER,\n"
                  "    }:\n"
                  "        if not context.approved_recipe_available:\n"
                  "            reasons.append(EligibilityReason.APPROVED_RECIPE_REQUIRED)\n"
                  "        if candidate.pair_model_id not in context.approved_artifact_model_ids:\n"
                  "            reasons.append(EligibilityReason.APPROVED_ARTIFACT_REQUIRED)\n"
              ),
          )
          PY
          rm scripts/materialize_i2a_batch.py
          rm -rf scripts/i2a_payload_parts
          rm .github/workflows/finalize-i2a-stage1-advisor-once.yml

      - name: Install core, LightGBM, CPU PyTorch, and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.13.0"
          python -m pip install \
            -c constraints/ci-py312.txt \
            -e ".[core,dev,lightgbm]"

      - name: Format and regenerate derived contracts
        run: |
          ruff format .
          ruff check --fix .
          python scripts/generate_config_schema.py
          python scripts/generate_capability_matrix.py
          python scripts/generate_repository_manifest.py

      - name: Run complete Python 3.12 all-model gate
        run: |
          python scripts/verify_repository.py
          ruff format --check .
          ruff check .
          mypy src tests
          pre-commit run --all-files
          pytest --junitxml="${RUNNER_TEMP}/i2a-all-models.xml"
          REPORT_PATH="${RUNNER_TEMP}/i2a-all-models.xml" python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          root = ElementTree.parse(Path(os.environ["REPORT_PATH"])).getroot()
          if root.tag == "testsuite":
              skipped = int(root.attrib.get("skipped", "0"))
          else:
              skipped = sum(
                  int(suite.attrib.get("skipped", "0"))
                  for suite in root.findall("testsuite")
              )
          if skipped:
              raise SystemExit(f"all-model verification skipped {skipped} tests")
          PY
          rm -rf build dist
          python -m build
          python scripts/verify_repository.py --distribution dist

      - name: Commit one verified I2A batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Stage-1 Linkage Strategy Advisor"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
