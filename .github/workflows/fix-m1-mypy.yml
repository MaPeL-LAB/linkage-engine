name: fix-m1-mypy

on:
  push:
    branches: [agent/m1-safe-foundation-implementation]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Apply typed fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          loader = Path("src/mapel_linkage/configuration/loader.py")
          text = loader.read_text(encoding="utf-8")
          text = text.replace(
              "import math\nfrom dataclasses import dataclass, field\n",
              "import math\nfrom collections.abc import Hashable\nfrom dataclasses import dataclass, field\n",
          )
          text = text.replace(
              ") -> dict[str, object]:\n",
              ") -> dict[Hashable, Any]:\n",
              1,
          )
          text = text.replace(
              "        mapping: dict[str, object] = {}\n",
              "        mapping: dict[Hashable, Any] = {}\n",
              1,
          )
          loader.write_text(text, encoding="utf-8")

          test_file = Path("tests/governance/test_paths_logging_and_manifests.py")
          test_text = test_file.read_text(encoding="utf-8")
          test_text = test_text.replace(
              '        SafeLogEvent(event="unsafe", record=sentinel)\n',
              '        SafeLogEvent.model_validate({"event": "unsafe", "record": sentinel})\n',
              1,
          )
          test_file.write_text(test_text, encoding="utf-8")
          PY
          ruff format .
          ruff check --fix .
          mypy src tests
          rm .github/workflows/fix-m1-mypy.yml
          python scripts/generate_repository_manifest.py
          ruff format --check .
          ruff check .
          mypy src tests
          python scripts/verify_repository.py
      - name: Commit typed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix M1 strict typing checks"
          git push
