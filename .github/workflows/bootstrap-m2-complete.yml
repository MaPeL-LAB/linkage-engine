name: bootstrap-m2-complete

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"
  MAPEL_TEST_DATA_POLICY: synthetic_only
  MAPEL_TEST_SEED: "20260817"

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout event ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Fetch the checksum-controlled transfer branch
        run: |
          git fetch origin \
            refs/heads/agent/m2-complete-synthetic-mvp-transfer-v1:refs/remotes/origin/agent/m2-complete-synthetic-mvp-transfer-v1
          git checkout --detach origin/agent/m2-complete-synthetic-mvp-transfer-v1

      - name: Reconstruct and verify the exact M2 patch
        run: |
          cat scripts/.m2_complete.patch.gz.b64.part* > /tmp/m2.patch.gz.b64
          printf '%s  %s\n' \
            '468705c4e58cb683546195896125e35ec73940d79be53e267fffd2a4db9261c8' \
            '/tmp/m2.patch.gz.b64' | sha256sum --check --strict
          base64 --decode /tmp/m2.patch.gz.b64 > /tmp/m2.patch.gz
          printf '%s  %s\n' \
            '4962459c92ef11c14c545dd42d7796de4389660c935cfb62ede8c19e27c6966d' \
            '/tmp/m2.patch.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/m2.patch.gz > /tmp/m2.patch
          printf '%s  %s\n' \
            '47d0e4790866917c340bf1c9382189a36bada2f967784ddeea1cbf508c881efe' \
            '/tmp/m2.patch' | sha256sum --check --strict

      - name: Publish the clean candidate branch
        run: |
          git reset --hard d1fb18008f2e0a0d6fa29e9a0c0f6dc99ca2bb11
          git clean -fdx
          git apply --index /tmp/m2.patch
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete M2 synthetic vertical slice"
          git push --force origin HEAD:refs/heads/agent/m2-complete-synthetic-mvp
