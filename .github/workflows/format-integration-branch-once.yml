name: format-integration-branch-once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"

jobs:
  format:
    if: github.head_ref == 'agent/integration-capability-audit'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request head branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Install pinned formatter
        run: python3 -m pip install ruff==0.16.3
      - name: Format changed Python files and regenerate derived files
        run: |
          rm .github/workflows/format-integration-branch-once.yml
          ruff format src/mapel_linkage/cli/main.py src/mapel_linkage/pipeline/recipes.py tests/test_capabilities.py tests/test_cli.py
          python3 scripts/generate_capability_matrix.py
          python3 scripts/generate_repository_manifest.py
      - name: Commit formatting and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format integration milestone"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
