name: verify-plural-config-stage-artifacts-once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"
  MAPEL_TEST_DATA_POLICY: synthetic_only
  MAPEL_TEST_SEED: "20260816"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  verify:
    if: github.head_ref == 'agent/plural-model-configuration-stage-artifacts'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request head branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply bounded configuration patch and remove temporary files
        run: |
          python scripts/apply_plural_model_stage_patch.py
          rm scripts/apply_plural_model_stage_patch.py
          rm .github/workflows/verify-plural-config-stage-artifacts-once.yml
      - name: Install full development and optional-model environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci-py312.txt -e ".[core,dev,lightgbm,neural]"
      - name: Format, regenerate derived contracts, and verify
        run: |
          ruff format .
          python scripts/generate_config_schema.py
          python scripts/generate_capability_matrix.py
          python scripts/generate_repository_manifest.py
          python scripts/verify_repository.py
          ruff format --check .
          ruff check .
          mypy src tests
          pre-commit run --all-files
          pytest -q
          rm -rf build dist
          python -m build
          python scripts/verify_repository.py --distribution dist
      - name: Commit verified milestone and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add plural model configuration and stage artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
