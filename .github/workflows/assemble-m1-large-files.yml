name: assemble-m1-large-files

on:
  push:
    branches: [agent/m1-safe-foundation-implementation]

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Assemble generated files
        run: |
          python scripts/bootstrap_m1_large_files.py
          rm scripts/bootstrap_m1_large_files.py
          rm .github/workflows/assemble-m1-large-files.yml
          python scripts/generate_repository_manifest.py
      - name: Commit assembled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assemble M1 generated configuration files"
          git push
