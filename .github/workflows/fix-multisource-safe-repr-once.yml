name: fix-multisource-safe-repr-once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"
  MAPEL_TEST_DATA_POLICY: synthetic_only
  MAPEL_TEST_SEED: "20260816"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  fix:
    if: github.head_ref == 'agent/plural-model-configuration-stage-artifacts'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request head branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Add deterministic aggregate-only representation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/mapel_linkage/clustering/contracts.py")
          text = path.read_text(encoding="utf-8")
          class_start = text.index("class MultiSourceResolutionResult:\n")
          insert_at = text.index("    def safe_summary(self) -> dict[str, Any]:\n", class_start)
          representation = (
              "    def __repr__(self) -> str:\n"
              "        return (\n"
              "            f\"MultiSourceResolutionResult(algorithm={self.algorithm!r}, \"\n"
              "            f\"total_records={self.total_records}, \"\n"
              "            f\"total_clusters={self.total_clusters}, \"\n"
              "            f\"singleton_count={self.singleton_count}, \"\n"
              "            f\"multi_record_cluster_count={self.multi_record_cluster_count}, \"\n"
              "            f\"cannot_link_violations={self.cannot_link_violations}, \"\n"
              "            f\"source_collision_count={self.source_collision_count}, \"\n"
              "            f\"resolution_digest={self.resolution_digest!r})\"\n"
              "        )\n\n"
          )
          if "    def __repr__(self) -> str:\n" in text[class_start:insert_at]:
              raise SystemExit("multi-source result already defines an explicit representation")
          path.write_text(text[:insert_at] + representation + text[insert_at:], encoding="utf-8")
          PY
          rm .github/workflows/fix-multisource-safe-repr-once.yml
      - name: Install core, LightGBM, CPU PyTorch, and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.13.0"
          python -m pip install \
            -c constraints/ci-py312.txt \
            -e ".[core,dev,lightgbm]"
      - name: Format, regenerate manifest, and verify complete gate
        run: |
          ruff format .
          ruff check --fix .
          python scripts/generate_config_schema.py
          python scripts/generate_capability_matrix.py
          python scripts/generate_repository_manifest.py
          python scripts/verify_repository.py
          ruff format --check .
          ruff check .
          mypy src tests
          pre-commit run --all-files
          pytest --junitxml="${RUNNER_TEMP}/all-models.xml"
          REPORT_PATH="${RUNNER_TEMP}/all-models.xml" python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path(os.environ["REPORT_PATH"])
          root = ElementTree.parse(report).getroot()
          if root.tag == "testsuite":
              skipped = int(root.attrib.get("skipped", "0"))
          else:
              skipped = sum(
                  int(suite.attrib.get("skipped", "0"))
                  for suite in root.findall("testsuite")
              )
          if skipped:
              raise SystemExit(f"all-model verification skipped {skipped} tests")
          PY
          rm -rf build dist
          python -m build
          python scripts/verify_repository.py --distribution dist
      - name: Commit verified representation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use aggregate-only multi-source result representation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
