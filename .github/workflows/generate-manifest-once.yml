name: generate-manifest-once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"

jobs:
  generate:
    if: github.head_ref == 'agent/integration-capability-audit'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Remove temporary workflow from working tree
        run: rm .github/workflows/generate-manifest-once.yml
      - name: Generate final-tree repository manifest
        run: python3 scripts/generate_repository_manifest.py
      - name: Upload generated manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-repository-manifest
          path: REPOSITORY_MANIFEST.txt
          if-no-files-found: error
          retention-days: 1
