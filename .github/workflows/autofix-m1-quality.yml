name: autofix-m1-quality

on:
  push:
    branches: [agent/m1-safe-foundation-implementation]

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Apply canonical formatting and safe lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/mapel_linkage/synthetic/generator.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "import json\nimport random\n",
              "import json\nimport random\nfrom contextlib import suppress\n",
          )
          text = text.replace(
              "                try:\n"
              "                    candidate.unlink(missing_ok=True)\n"
              "                except OSError:\n"
              "                    pass\n",
              "                with suppress(OSError):\n"
              "                    candidate.unlink(missing_ok=True)\n",
          )
          path.write_text(text, encoding="utf-8")
          PY
          ruff format .
          ruff check --fix .
          ruff format .
          rm .github/workflows/autofix-m1-quality.yml
          python scripts/generate_repository_manifest.py
          ruff format --check .
          ruff check .
      - name: Commit quality fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply M1 Python quality formatting"
          git push
