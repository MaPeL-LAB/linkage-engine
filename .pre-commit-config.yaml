repos:
  - repo: local
    hooks:
      - id: ruff-format-check
        name: Ruff formatting check
        entry: ruff format --check .
        language: system
        pass_filenames: false
      - id: ruff-lint
        name: Ruff lint
        entry: ruff check .
        language: system
        pass_filenames: false
      - id: repository-boundary
        name: Repository privacy and documentation boundary
        entry: python scripts/verify_repository.py
        language: system
        pass_filenames: false
      - id: error-code-catalogue
        name: Generated safe error-code catalogue
        entry: python scripts/generate_error_code_catalogue.py --check
        language: system
        pass_filenames: false
      - id: release-controls
        name: Fail-closed private release controls
        entry: python scripts/verify_release_readiness.py --expect-blocked
        language: system
        pass_filenames: false
