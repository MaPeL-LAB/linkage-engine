schema_version: "0.1"
project:
  project_id: synthetic_all_models
  entity_type: generic_entity
  linkage_mode: link_only
  assignment_constraint: one_to_one
  random_seed: 20260816
runtime: {backend: duckdb, maximum_candidate_pairs: 100000, deterministic_mode: true}
privacy:
  allowed_input_roots: [data, private]
  allowed_output_roots: [private, artifacts]
  allow_remote_uris: false
  allow_network_access: false
  log_policy: aggregate_only
  include_tracebacks: false
datasets:
  - {id: source_a, role: source, path: data/synthetic/source_a.jsonl, format: jsonl, record_id_column: record_key}
  - {id: source_b, role: target, path: data/synthetic/source_b.jsonl, format: jsonl, record_id_column: record_key}
variables:
  - id: label_text
    data_type: string
    source_columns: {source_a: label_value, source_b: label_value}
    normalisation:
      - {kind: unicode_normalize, form: NFKC}
      - {kind: casefold}
      - {kind: strip}
      - {kind: collapse_whitespace}
    missingness: {blank_is_missing: true, comparison_policy: explicit_missing_level}
  - id: date_value
    data_type: date
    source_columns: {source_a: date_value, source_b: date_value}
    normalisation:
      - {kind: parse_date, formats: ["%Y-%m-%d"]}
    missingness: {blank_is_missing: true, comparison_policy: explicit_missing_level}
  - id: group_value
    data_type: categorical
    source_columns: {source_a: group_value, source_b: group_value}
    normalisation: [{kind: casefold}, {kind: strip}]
    missingness: {blank_is_missing: true, comparison_policy: explicit_missing_level}
deterministic_anchors:
  - id: exact_label_date
    predicate:
      kind: all
      terms:
        - {kind: exact, variable: label_text}
        - {kind: exact, variable: date_value}
    require_unique_left: true
    require_unique_right: true
    action: evidence_only
    allow_as_training_truth: false
blocking:
  rules:
    - {id: group_value_exact, predicate: {kind: exact, variable: group_value}}
    - id: date_and_label_prefix
      predicate:
        kind: all
        terms:
          - {kind: exact, variable: date_value}
          - {kind: prefix_equal, variable: label_text, length: 1}
comparisons:
  - id: label_similarity
    variable: label_text
    function: {kind: jaro_winkler}
    levels:
      - {kind: missing}
      - {kind: exact}
      - {kind: threshold, minimum: 0.92}
      - {kind: threshold, minimum: 0.85}
      - {kind: else}
  - id: date_difference
    variable: date_value
    function: {kind: date_difference, unit: day}
    levels:
      - {kind: missing}
      - {kind: exact}
      - {kind: maximum_difference, value: 2}
      - {kind: maximum_difference, value: 31}
      - {kind: else}
  - id: group_agreement
    variable: group_value
    function: {kind: categorical}
    levels: [{kind: missing}, {kind: exact}, {kind: else}]
labels:
  source:
    kind: synthetic_truth
    entity_group_columns: {source_a: synthetic_entity_id_a, source_b: synthetic_entity_id_b}
    household_group_columns: {source_a: synthetic_household_id_a, source_b: synthetic_household_id_b}
  permit_weak_labels_for_training: false
  permit_unverified_crosswalk: false
models:
  fellegi_sunter:
    enabled: true
    implementation: splink_duckdb
    model_id: fs_baseline
    probability_two_random_records_match: 0.001
    u_max_pairs: 100000
    em_max_iterations: 25
    em_convergence: 0.0001
    probability_smoothing: 0.5
    estimate_u_by_random_sampling: true
    estimate_m_by_em: true
    term_frequency_adjustments: false
  boosted_trees:
    - enabled: true
      implementation: xgboost_classifier
      model_id: xgb_pair_classifier
      n_estimators: 12
      max_depth: 3
      learning_rate: 0.1
      maximum_training_pairs: 100000
      n_jobs: 1
      deterministic_mode: true
    - enabled: true
      implementation: lightgbm_classifier
      model_id: lgb_pair_classifier
      n_estimators: 12
      max_depth: 3
      learning_rate: 0.1
      maximum_training_pairs: 100000
      n_jobs: 1
      deterministic_mode: true
  neural_models:
    - enabled: true
      implementation: pytorch_pair_mlp
      model_id: pytorch_pair_mlp
      epochs: 10
      learning_rate: 0.01
      weight_decay: 0.00001
      maximum_training_pairs: 100000
      device: cpu
      n_threads: 1
      deterministic_mode: true
  ensembles:
    - enabled: true
      implementation: stacking_logistic
      model_id: stacking_logistic
      base_model_ids: [xgb_pair_classifier, lgb_pair_classifier]
      maximum_training_pairs: 100000
      deterministic_mode: true
  ranking_models:
    - enabled: true
      implementation: xgboost_ranker
      model_id: xgb_candidate_ranker
      query_side: source
      top_k: 5
      n_estimators: 12
      max_depth: 3
      learning_rate: 0.1
      maximum_training_pairs: 100000
      n_jobs: 1
      deterministic_mode: true
    - enabled: true
      implementation: lightgbm_ranker
      model_id: lgb_candidate_ranker
      query_side: target
      top_k: 5
      n_estimators: 12
      max_depth: 3
      learning_rate: 0.1
      maximum_training_pairs: 100000
      n_jobs: 1
      deterministic_mode: true
  portfolio:
    portfolio_schema_version: "1"
    portfolio_id: synthetic_all_models
    pair_model_ids:
      - fs_baseline
      - xgb_pair_classifier
      - lgb_pair_classifier
      - pytorch_pair_mlp
      - stacking_logistic
    ranking_model_ids: [xgb_candidate_ranker, lgb_candidate_ranker]
    mandatory_baseline_id: fs_baseline
    maximum_challengers: 4
model_selection: {primary_metric: average_precision}
calibration: {method: sigmoid, source_model: selected_champion, partition: calibration}
assignment:
  solver: ortools_min_cost_flow
  constraint: one_to_one
  no_match: {enabled: true, utility: 0.0}
decision_policy:
  confirmed: {minimum_probability: 0.97, minimum_probability_margin: 0.15, require_assignment: true}
  review_required: {minimum_probability: 0.60}
  no_match: {maximum_top_probability: 0.20, require_complete_candidate_search: true}
  unresolved: {fallback: true}
validation:
  split:
    method: entity_household_connected_components
    training_fraction: 0.55
    validation_fraction: 0.15
    calibration_fraction: 0.10
    decision_fraction: 0.10
    test_fraction: 0.10
  hard_negative_sampling: {enabled: true, verified_nonmatches_only: true}
  candidate_recall_k: [1, 5, 10]
outputs:
  restricted_directory: private/outputs
  permitted_fields: [relationship_id, relationship_status, calibrated_probability, candidate_rank, probability_margin, decision_rule_id, assignment_method, assignment_constraint, run_id, configuration_digest, feature_schema_digest, non_sensitive_provenance, created_at]
  permitted_variable_values: []
